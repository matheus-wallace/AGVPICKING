[versions]
agp = "8.11.1"
kotlin = "2.2.21"
activityCompose = "1.13.0"
composeBom = "2026.05.01"
mwdat = "0.9.0"
lifecycle = "2.10.0"
coroutines = "1.10.2"
vosk = "0.3.75"
# sherpa-onnx NÃO tem artefato no Maven Central — verificado na API do Central, que não
# devolve nenhum pacote do k2-fsa. O AAR oficial é publicado como release asset no GitHub e
# está vendorizado em `app/libs/`. A versão fica aqui mesmo assim: é ela que o build.gradle.kts
# usa para montar o nome do arquivo, então trocar de versão continua sendo mudar um lugar só.
# Ver design.md de add-sherpa-onnx-asr-engine, "Verificação da API do sherpa-onnx", item 1.1.
sherpaOnnx = "1.13.5"
# Picovoice Rhino — última versão publicada no Maven Central em 19/08/2026, confirmada no
# `maven-metadata.xml` do artefato (`<release>4.0.2</release>`), não na documentação do produto.
# O `.aar` foi baixado e inspecionado antes de qualquer código: ver design.md de
# `add-picovoice-asr-engine`, seção "Verificação da API do Rhino".
picovoiceRhino = "4.0.2"
mlkitBarcode = "17.3.0"
junit = "4.13.2"
exifInterface = "1.4.2"

[libraries]
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
mwdat-core = { group = "com.meta.wearable", name = "mwdat-core", version.ref = "mwdat" }
mwdat-camera = { group = "com.meta.wearable", name = "mwdat-camera", version.ref = "mwdat" }
mwdat-mockdevice = { group = "com.meta.wearable", name = "mwdat-mockdevice", version.ref = "mwdat" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-exifinterface = { group = "androidx.exifinterface", name = "exifinterface", version.ref = "exifInterface" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
# ASR local do doc §5. O grupo é `com.alphacephei`, não `org.vosk` — verificado no Maven
# Central, junto com a dependência transitiva `net.java.dev.jna:jna` que o .aar puxa.
vosk-android = { group = "com.alphacephei", name = "vosk-android", version.ref = "vosk" }
# Picovoice Rhino — fala-para-intenção do `MotorPicovoiceRhino`. Ao contrário do sherpa-onnx,
# **tem** artefato no Maven Central (`ai.picovoice:rhino-android`, Apache-2.0), então entra por
# coordenada e não por arquivo vendorizado. O `.aar` já traz o runtime nativo das quatro ABIs e o
# modelo de idioma **inglês** em `res/raw/rhino_params.pv`; o modelo pt-BR não vem junto e está
# vendorizado em `app/src/main/assets/modelo-picovoice-rhino/` (ver PROVENIENCIA.md de lá).
picovoice-rhino-android = { group = "ai.picovoice", name = "rhino-android", version.ref = "picovoiceRhino" }
# Leitura de código de barras do doc §6.3, passo 1 da cascata. `barcode-scanning` é a
# distribuição **bundled** (o modelo vai dentro do APK); a variante `barcode-scanning-common`
# via Play Services baixaria o modelo no primeiro uso e quebraria o requisito offline.
mlkit-barcode-scanning = { group = "com.google.mlkit", name = "barcode-scanning", version.ref = "mlkitBarcode" }
junit = { group = "junit", name = "junit", version.ref = "junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
jetbrains-kotlin-android = { id = "org.jetbrains.kotlin.android", version.ref = "kotlin" }
compose-compiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
